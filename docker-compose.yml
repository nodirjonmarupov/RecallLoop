services:
  db:
    image: postgres:18
    container_name: recallloop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recallloop
      POSTGRES_PASSWORD: recallloop_dev
      POSTGRES_DB: recallloop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  